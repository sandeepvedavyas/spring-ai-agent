server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: spring-ai-agent
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 30s
  ai:
    model:
      chat: openai
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 200ms
        multiplier: 2
        max-interval: 2s
    chat:
      client:
        observations:
          log-prompt: false
          log-completion: false
      observations:
        log-prompt: false
        log-completion: false
    openai:
      api-key: ${OPENAI_API_KEY:local-demo}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.2

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: spring-ai-agent

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %5p [${spring.application.name:},%X{requestId:-}] %m%n"

info:
  app:
    name: spring-ai-agent
    description: Demo trip-planning agent. Not affiliated with GetYourGuide.
    version: 0.1.0

agent:
  auth:
    api-key: ${AGENT_API_KEY:local-dev-key}
  llm:
    timeout: ${OPENAI_TIMEOUT:30s}
